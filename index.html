<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="flex items-center justify-between bg-white px-4 py-3 shadow-sm sm:px-6">
        <div class="flex items-center gap-2">
            <img src="img/buslogo.png" alt="Logo BusDirect" class="h-10 w-10 object-contain">
            <h1 class="text-xl font-bold text-blue-700">BusDirect</h1>
        </div>
        <nav class="flex gap-3 text-sm sm:gap-5">
            <a href="index.html" class="hover:text-blue-600">Accueil</a>
            <a href="cabine.html" class="lien-actif">Réservations</a>
        </nav>
    </header>
    <section class="boxes flex flex-wrap justify-around  bg-gray-100">
        <div class="box1  border  bg-[#03045E] rounded-md shadow-xl mt-6 mb-6 pr-10 pl-10 pt-4">
            <p id="traject" class="m-0 text-left  font-bold pr-8 pl-8 text-white">Trajet</p>
            <p id="trajets" class="font-bold text-xl text-center text-white mt-2 mb-2">0</p>
        </div>
        <div class="box2 border  bg-[#03045E] rounded-md shadow-xl text-white mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class="text-left font-bold ">Nombre Passagers</p>
            <p id="NombrePassagers" class="font-bold text-xl text-center text-white mt-2 mb-2">0</p>

        </div>
        <div class="box3 border  bg-[#03045E] rounded-md shadow-xl text-white mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class="m-0 text-left font-bold pr-8 pl-8">La Recette</p>
            <p id="LaRecettes" class="font-bold text-xl text-center text-white mt-2 mb-2">0</p>
        </div>
        <div class="box4 border  bg-[#03045E] rounded-md shadow-xl text-white mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class=" text-left font-bold ">Les Trajets Complet</p>
            <p id="TrajetsComplet" class="font-bold text-xl text-center text-white mt-2 mb-2">0</p>
        </div>
    </section>
    <section class="bg-white px-4 py-3 shadow-sm sm:px-6">
        <div class="flex items-center justify-end  gap-4">
            <div class="flex items-center">
                <input id="searchCity" class="border-2 border-black focus:border-[#03045E] focus:outline-none" type="text"
                    placeholder="Chercher">
                <img class="h-[30px] w-[30px]" src="img/search.svg" alt="icon search">
            </div>
            <select id="traject-status" class="border-2 border-black bg-gray-100 rounded-xl">
                <option value="touTraject">Tout les traject</option>
                <option value="Occupée">Occupée</option>
                <option value="libre">libre</option>
            </select>
        </div>
    </section>
    <section id="tripcontainer" class="grid grid-cols-3 grid-row-2 gap-8 mx-4 my-4">
    </section>
    <div id="pagination" class="flex justify-center gap-3 mt-6"></div>
    <footer class="bg-white p-4 text-center text-sm text-gray-500">
        © 2026 BusDirect
    </footer>
    <script type="module" src="./js/store.js"></script>
    <script type="module" src="./js/reservations.js"></script>
    <script type="module" src="./js/main-trajets.js"></script>
</body>

</html>
