<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="flex items-center justify-between bg-white px-4 py-3 shadow-sm sm:px-6">
        <div class="flex items-center gap-2">
            <img src="img/buslogo.png" alt="Logo BusDirect" class="h-10 w-10 object-contain">
            <h1 class="text-xl font-bold text-blue-700">BusDirect</h1>
        </div>
        <nav class="flex gap-3 text-sm sm:gap-5">
            <a href="index.html" class="hover:text-blue-600">Accueil</a>
            <a href="cabine.html" class="lien-actif">Réservations</a>
        </nav>
    </header>
    <section class="boxes flex flex-wrap justify-around  bg-gray-100">
        <div class="box1 border  bg-[#03045E] rounded-md shadow-xl mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class="m-0 text-left min-h-[100px] font-bold pr-8 pl-8 text-white">Trajet</p>
        </div>
        <div class="box2 border  bg-[#03045E] rounded-md shadow-xl text-white mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class="text-left font-bold ">Nombre Passagers</p>
        </div>
        <div class="box3 border  bg-[#03045E] rounded-md shadow-xl text-white mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class="m-0 text-left font-bold pr-8 pl-8">La Recette</p>
        </div>
        <div class="box4 border  bg-[#03045E] rounded-md shadow-xl text-white mt-6 mb-6 pr-10 pl-10 pt-4">
            <p class=" text-left font-bold ">Les Trajets Complet</p>
        </div>
    </section>
    <section class="bg-white px-4 py-3 shadow-sm sm:px-6">
        <div class="flex items-center justify-end  gap-4">
            <div class="flex items-center">
                <input class="border-2 border-black focus:border-[#03045E] focus:outline-none" type="text"
                    placeholder="Chercher">
                <img class="h-[30px] w-[30px]" src="img/search.svg" alt="icon search">
            </div>
            <select id="traject-status" class="border-2 border-black bg-gray-100 rounded-xl">
                <option>Tout les traject</option>
                <option>Occupée</option>
                <option>libre</option>
            </select>
        </div>
    </section>
    <section class="grid grid-cols-3 grid-row-2 gap-8 mx-4 my-4">
        <div class="box-1 w-full h-26 bg-gray-100 border-2 p-6 border-gray-200 rounded-md shadow-lg"></div>
        <div class="box-2 w-full h-26 bg-gray-100 border-2 p-6 border-gray-200 rounded-md shadow-lg"></div>
        <div class="box-3 w-full h-26 bg-gray-100 border-2 p-6 border-gray-200 rounded-md shadow-lg"></div>
        <div class="box-4 w-full h-26 bg-gray-100 border-2 p-6 border-gray-200 rounded-md shadow-lg"></div>
        <div class="box-5 w-full h-26 bg-gray-100 border-2 p-6 border-gray-200 rounded-md shadow-lg"></div>
        <div class="box-6 w-full h-26 bg-gray-100 border-2 p-6 border-gray-200 rounded-md shadow-lg"></div>
    </section>
    <section class="flex items-center justify-center gap-4">
        <button class="slide1 border-2 border-pink-400 rounded-md bg-pink-300 pr-2 pl-2 pt-1 pb-1">&lt;</button>
        <button class="slide2 border-2 border-[#03045E] rounded-md bg-[#03045E] text-white pr-2 pl-2 pt-1 pb-1">1</button>
        <button class="slide3 border-2 border-[#03045E] rounded-md bg-[#03045E] text-white pr-2 pl-2 pt-1 pb-1">2</button>
        <button class="slide4 border-2 border-[#03045E] rounded-md bg-[#03045E] text-white pr-2 pl-2 pt-1 pb-1">3</button>
        <button class="slide5 border-2 border-pink-400 rounded-md bg-pink-300 pr-2 pl-2 pt-1 pb-1">&gt;</button>
    </section>
    <footer class="bg-white p-4 text-center text-sm text-gray-500">
        © 2026 BusDirect
    </footer>
    <script type="module" src="./js/store.js"></script>
</body>

</html>
